  { id: 'awk-columns', title: 'Columns with awk', cmds: 'awk',

/* ---------- state ---------- */
let done = {};
try { done = JSON.parse(localStorage.getItem('unix-course-done') || '{}'); } catch (e) { done = {}; }
function saveDone() { try { localStorage.setItem('unix-course-done', JSON.stringify(done)); } catch (e) {} }
let current = 0;

function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function renderNav() {
  const nav = document.getElementById('navlist');
  nav.innerHTML = LESSONS.map((l, i) => '<a href="#' + l.id + '"' + (i === current ? ' aria-current="page"' : '') + ' class="' + (done[l.id] ? 'done' : '') + '"><span class="mark">' + (done[l.id] ? '✓ ' : '') + (i + 1) + '</span><span class="name">' + l.title + '</span></a>').join('');
  const n = LESSONS.filter(l => done[l.id]).length;
  document.getElementById('progtxt').textContent = n + ' of ' + LESSONS.length;
  document.getElementById('progbar').style.width = (n / LESSONS.length * 100) + '%';
}

function renderLesson() {
  const l = LESSONS[current];
  const main = document.getElementById('main');
  main.onclick = null;
  if (l.type === 'quiz') { renderQuiz(main, l); return; }
  main.innerHTML =
    '<div class="lesson-head"><div class="kicker">Lesson ' + (current + 1) + ' of ' + LESSONS.length + ' · ' + esc(l.cmds) + '</div><h2>' + l.title + '</h2><p>' + l.intro + '</p></div>' +
    '<div class="body">' + l.body + '</div>' +
    '<div class="cmds-wrap"><table class="cmds">' + l.cmds_t.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + r[1] + '</td></tr>').join('') + '</table></div>' +
    '<p class="tip body">' + l.tip + '</p>' +
    '<section class="practice" aria-label="Practice shell">' +
      '<div class="task"><div class="t"><div class="lbl">Your task</div><div class="txt">' + l.task + '</div></div><span class="status' + (done[l.id] ? ' ok' : '') + '" id="status">' + (done[l.id] ? 'Complete' : 'Not yet') + '</span></div>' +
      '<div class="term"><div class="out" id="out" role="log" aria-live="polite"></div>' +
      '<form class="inrow" id="form"><label class="pr" id="pr" for="cmd"></label><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command"></form></div>' +
      '<div class="tbar"><span>Type <code>help</code> to see the supported commands. Arrow up repeats the last one.</span><button type="button" id="reset">Reset files</button></div>' +
    '</section>' +
    '<div class="pager"><button type="button" id="prev"' + (current === 0 ? ' disabled' : '') + '>← Previous</button><button type="button" class="primary" id="next"' + (current === LESSONS.length - 1 ? ' disabled' : '') + '>Next lesson →</button></div>';
  const out = document.getElementById('out'); const input = document.getElementById('cmd');
  const setPrompt = () => { document.getElementById('pr').textContent = 'learner@unix:' + promptPath() + '$'; };
  const print = (txt, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = txt; out.appendChild(d); out.scrollTop = out.scrollHeight; };
  print('Practice shell. Your files persist as you move between lessons until you reset them.', 'note');
  setPrompt();
  let hi = 0;
  function checkTask() {
    if (done[l.id] || !l.check()) return;
    done[l.id] = true; saveDone();
    const s = document.getElementById('status'); s.textContent = 'Complete'; s.classList.add('ok');
    print('Task complete. Move on when you are ready.', 'note'); renderNav();
  }
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const line = input.value.trim(); input.value = '';
    if (!line) return;
    hist.push(line); hi = hist.length;
    const row = document.createElement('div'); row.className = 'cmdline';
    row.innerHTML = '<span class="pr">learner@unix:' + esc(promptPath()) + '$</span> ' + esc(line); out.appendChild(row);
    try {
      const res = runLine(line);
      if (res === '\x00CLEAR') out.innerHTML = '';
      else if (res === '\x00VIM') { cmdLog.push(line); openVim(out, input, document.getElementById('form'), print, () => { setPrompt(); checkTask(); }); return; }
      else if (res) print(res.replace(/\n$/, ''));
      cmdLog.push(line);
    } catch (err) { print(String(err), 'err'); }
    setPrompt(); out.scrollTop = out.scrollHeight;
    checkTask();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && hist.length) { hi = Math.max(0, hi - 1); input.value = hist[hi]; e.preventDefault(); }
    if (e.key === 'ArrowDown' && hist.length) { hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ''; e.preventDefault(); }
  });
  document.getElementById('reset').onclick = () => { resetWorld(); out.innerHTML = ''; print('Files and processes reset.', 'note'); setPrompt(); };
  document.getElementById('prev').onclick = () => go(current - 1);
  document.getElementById('next').onclick = () => go(current + 1);
}
function openVim(out, input, form, print, onExit) {
  const path = vimTarget; const existing = pathOf(path);
  if (existing && existing.t === 'd') { print('vim: ' + path + ' is a directory', 'err'); onExit(); return; }
  let lns = existing ? lines(existing.c) : ['']; if (!lns.length) lns = [''];
  let r = 0, c = 0, mode = 'n', cmd = '', pend = '', dirty = false;
  let msg = (existing ? '"' + path + '" ' + lns.length + 'L' : '"' + path + '" [New]') + '   (click here and type; this is a simulated vim)';
  const saved = out.innerHTML;
  form.hidden = true;
  const ed = document.createElement('pre'); ed.tabIndex = 0; ed.className = 'vimscreen'; ed.setAttribute('aria-label', 'vim editor');
  out.innerHTML = ''; out.appendChild(ed);
  function render() {
    const body = lns.map((l, i) => {
      let s;
      if (i === r) { const ch = c < l.length ? l[c] : ' '; s = esc(l.slice(0, c)) + '<span class="cur">' + esc(ch) + '</span>' + esc(l.slice(c + 1)); } else s = esc(l);
      return '<span class="ln">' + String(i + 1).padStart(3) + '</span> ' + s;
    }).join('\n');
    const status = mode === ':' ? ':' + esc(cmd) : mode === 'i' ? '-- INSERT --' : esc(msg);
    ed.innerHTML = body + '\n\n<span class="vstat">' + status + '</span>';
  }
  function save() {
    const txt = lns.join('\n') + '\n'; const [p, nm] = parentOf(path);
    if (!p) { msg = "E212: Can't open file for writing"; return false; }
    if (p.k[nm]) p.k[nm].c = txt; else p.k[nm] = F(txt);
    dirty = false; msg = '"' + path + '" ' + lns.length + 'L written'; return true;
  }
  function quit() { ed.removeEventListener('keydown', onKey); out.innerHTML = saved; form.hidden = false; input.focus(); print('(left vim)', 'note'); onExit(); }
  function clamp() { r = Math.max(0, Math.min(lns.length - 1, r)); const max = mode === 'i' ? lns[r].length : Math.max(0, lns[r].length - 1); c = Math.max(0, Math.min(max, c)); }
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key; if (k === 'Tab') return; e.preventDefault();
    if (mode === 'i') {
      if (k === 'Escape') { mode = 'n'; c--; msg = ''; }
      else if (k === 'Enter') { const rest = lns[r].slice(c); lns[r] = lns[r].slice(0, c); lns.splice(r + 1, 0, rest); r++; c = 0; dirty = true; }
      else if (k === 'Backspace') { if (c > 0) { lns[r] = lns[r].slice(0, c - 1) + lns[r].slice(c); c--; dirty = true; } else if (r > 0) { c = lns[r - 1].length; lns[r - 1] += lns[r]; lns.splice(r, 1); r--; dirty = true; } }
      else if (k === 'ArrowLeft') c--; else if (k === 'ArrowRight') c++; else if (k === 'ArrowUp') r--; else if (k === 'ArrowDown') r++;
      else if (k.length === 1) { lns[r] = lns[r].slice(0, c) + k + lns[r].slice(c); c++; dirty = true; }
    } else if (mode === ':') {
      if (k === 'Escape') { mode = 'n'; cmd = ''; }
      else if (k === 'Backspace') { if (cmd) cmd = cmd.slice(0, -1); else mode = 'n'; }
      else if (k === 'Enter') {
        const x = cmd.trim(); cmd = ''; mode = 'n';
        if (x === 'w') save();
        else if (x === 'wq' || x === 'x') { if (save()) return quit(); }
        else if (x === 'q') { if (dirty) msg = 'E37: No write since last change (add ! to override)'; else return quit(); }
        else if (x === 'q!') return quit();
        else msg = 'E492: Not an editor command: ' + x;
      } else if (k.length === 1) cmd += k;
    } else {
      if (pend === 'd') { pend = ''; if (k === 'd') { lns.splice(r, 1); if (!lns.length) lns = ['']; dirty = true; } }
      else if (pend === 'g') { pend = ''; if (k === 'g') r = 0; }
      else if (k === 'h' || k === 'ArrowLeft') c--; else if (k === 'l' || k === 'ArrowRight') c++;
      else if (k === 'j' || k === 'ArrowDown') r++; else if (k === 'k' || k === 'ArrowUp') r--;
      else if (k === '0') c = 0; else if (k === '$') c = 1e9;
      else if (k === 'G') r = lns.length - 1;
      else if (k === 'd' || k === 'g') pend = k;
      else if (k === 'x') { lns[r] = lns[r].slice(0, c) + lns[r].slice(c + 1); dirty = true; }
      else if (k === 'i') mode = 'i';
      else if (k === 'a') { mode = 'i'; c++; }
      else if (k === 'A') { mode = 'i'; c = 1e9; }
      else if (k === 'o') { lns.splice(r + 1, 0, ''); r++; c = 0; mode = 'i'; dirty = true; }
      else if (k === 'O') { lns.splice(r, 0, ''); c = 0; mode = 'i'; dirty = true; }
      else if (k === ':') { mode = ':'; cmd = ''; }
    }
    clamp(); render();
  }
  ed.addEventListener('keydown', onKey);
  ed.addEventListener('click', () => ed.focus());
  render(); ed.focus();
}

  { q: 'Which command removes a directory and everything in it?', o: ['<code>rm dir</code>', '<code>rmdir -f dir</code>', '<code>rm -r dir</code>', '<code>del dir</code>'], a: 2, e: 'rm needs -r for directories. There is no undo.' },
  { q: 'What does <code>mv todo.txt tasks.txt</code> do?', o: ['Copies the file', 'Renames the file', 'Deletes both files', 'Moves it to the root'], a: 1, e: 'Moving and renaming are the same operation.' },

  { q: 'What does <code>grep -v ERROR log.txt</code> print?', o: ['Lines containing ERROR', 'Lines without ERROR', 'Only the first ERROR', 'The count of ERROR lines'], a: 1, e: '-v inverts the match.' },
  { q: 'Why do you usually <code>sort</code> before <code>uniq</code>?', o: ['uniq only collapses neighbouring duplicates', 'sort makes uniq faster', 'uniq cannot read files', 'It is only a convention'], a: 0, e: 'Without sorting, equal lines may not be next to each other.' },
  { q: 'What is the difference between <code>&gt;</code> and <code>&gt;&gt;</code>?', o: ['None', '&gt; appends, &gt;&gt; overwrites', '&gt; overwrites, &gt;&gt; appends', '&gt;&gt; also pipes'], a: 2, e: 'Use &gt;&gt; when you want to keep what is already in the file.' },
  { q: '<code>chmod 755 run.sh</code> gives which permissions?', o: ['<code>rw-r--r--</code>', '<code>rwxr-xr-x</code>', '<code>rwx------</code>', '<code>r-xr-xr-x</code>'], a: 1, e: '7 is rwx, 5 is r-x.' },
  { q: 'You wrote a script and <code>./run.sh</code> says Permission denied. What is the usual fix?', o: ['<code>chmod +x run.sh</code>', '<code>kill run.sh</code>', 'Rename it to .exe', 'Run <code>ls -l</code> twice'], a: 0, e: 'The file needs the execute bit.' },
  { q: 'What does <code>sed \'s/a/b/g\' file</code> do?', o: ['Replaces every a with b in the output', 'Deletes all lines with a', 'Edits the file in place', 'Counts the a characters'], a: 0, e: 'It prints the result. Add -i to change the file itself.' },
  { q: 'What does <code>awk \'{print $2}\' file</code> print?', o: ['The second line', 'The second field of every line', 'The last field', 'Two copies of the file'], a: 1, e: 'Fields are separated by whitespace unless you pass -F.' },
  { q: 'Which command lists the contents of an archive without extracting it?', o: ['<code>tar -xf a.tar</code>', '<code>tar -cf a.tar</code>', '<code>tar -tf a.tar</code>', '<code>tar -zf a.tar</code>'], a: 2, e: 't is for list.' },
  { q: 'Which saves a web response to a file?', o: ['<code>curl -I url</code>', '<code>curl -o file url</code>', '<code>curl -L url</code>', '<code>curl --save url</code>'], a: 1, e: '-o names the output file.' },
  { q: 'You are in vim, have typed changes and want to leave without saving. What do you type?', o: ['<code>:wq</code>', '<code>:w</code>', '<code>:q!</code>', '<code>dd</code>'], a: 2, e: 'Press Esc first to be sure you are in normal mode. :q! quits and discards changes.' }
];
function renderQuiz(main, l) {
  const ans = new Array(QUIZ.length).fill(-1);
  const need = Math.ceil(QUIZ.length * 0.8);
  const draw = () => {
    const n = ans.filter(x => x >= 0).length; const score = ans.filter((x, i) => x === QUIZ[i].a).length;
    const finished = n === QUIZ.length;
    if (finished && score >= need && !done[l.id]) { done[l.id] = true; saveDone(); renderNav(); }
    main.innerHTML =
      '<div class="lesson-head"><div class="kicker">Lesson ' + (current + 1) + ' of ' + LESSONS.length + ' · ' + n + ' of ' + QUIZ.length + ' answered</div><h2>' + l.title + '</h2><p>' + l.intro.replace('12', need) + '</p></div>' +
      '<div class="quiz">' + QUIZ.map((q, i) => '<fieldset class="q"><legend>' + (i + 1) + '. ' + q.q + '</legend>' + q.o.map((o, j) => {
        let cls = ''; if (ans[i] >= 0) { if (j === q.a) cls = ' right'; else if (j === ans[i]) cls = ' wrong'; }
        return '<button type="button" class="opt' + cls + '" data-q="' + i + '" data-o="' + j + '"' + (ans[i] >= 0 ? ' disabled' : '') + '>' + o + '</button>';
      }).join('') + (ans[i] >= 0 ? '<p class="why">' + q.e + '</p>' : '') + '</fieldset>').join('') + '</div>' +
      (finished ? '<div class="result"><div><strong>You scored ' + score + ' of ' + QUIZ.length + '.</strong> ' + (score >= need ? 'Course complete.' : 'You need ' + need + ' to finish. Review the lessons and try again.') + '</div><button type="button" class="primary" id="retry">Try again</button></div>' : '') +
      '<div class="pager"><button type="button" id="prev">← Previous</button><span></span></div>';
  };
  main.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('opt')) { ans[+b.dataset.q] = +b.dataset.o; draw(); }
    else if (b.id === 'retry') { ans.fill(-1); draw(); window.scrollTo({ top: 0 }); }
    else if (b.id === 'prev') go(current - 1);
  };
  draw();
}
function go(i) { location.hash = LESSONS[Math.max(0, Math.min(LESSONS.length - 1, i))].id; }
function route() {
  const id = location.hash.slice(1); const i = LESSONS.findIndex(l => l.id === id);
  current = i < 0 ? 0 : i; renderNav(); renderLesson();
  if (i >= 0) window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', route);
resetWorld(); route();
</script>
